<text x="24.0" y="200.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400" >The same frozen development split is used for model selection and for the final gate. Sampled and greedy decoding must both pass; temperature is never tuned after training.</text>
